services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: deepresearch
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: deepresearch
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["/minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
  neo4j:
    image: neo4j:5.26-community
    profiles: ["task-kg"]
    environment:
      NEO4J_AUTH: neo4j/deepresearch
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p deepresearch 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["neo4j-data:/data"]
volumes:
  postgres-data:
  minio-data:
  elasticsearch-data:
  neo4j-data:
