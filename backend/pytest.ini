[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -m "not needs_infra"
markers =
    unit: pure unit tests without any infrastructure
    integration: requires PostgreSQL and TEST_DATABASE_URL
    needs_infra: requires external infrastructure (DB/Redis/Milvus/LLM); skipped by default
    llm_eval: calls the configured live LLM
