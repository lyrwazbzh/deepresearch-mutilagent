name: industry-observability

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: industry_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - industry_network

  elasticsearch-setup:
    image: curlimages/curl:8.12.1
    container_name: industry_elasticsearch_setup
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        until curl -fsS http://elasticsearch:9200/_cluster/health >/dev/null; do sleep 5; done
        curl -fsS -X PUT http://elasticsearch:9200/_ilm/policy/industry-research-logs-30d \
          -H 'Content-Type: application/json' \
          --data '{"policy":{"phases":{"hot":{"actions":{}},"delete":{"min_age":"30d","actions":{"delete":{}}}}}}'
        curl -fsS -X PUT http://elasticsearch:9200/_index_template/industry-research-logs \
          -H 'Content-Type: application/json' \
          --data '{"index_patterns":["industry-research-logs-*"],"priority":150,"template":{"settings":{"index.lifecycle.name":"industry-research-logs-30d"},"mappings":{"properties":{"timestamp":{"type":"date"},"level":{"type":"keyword"},"service":{"type":"keyword"},"environment":{"type":"keyword"},"event":{"type":"keyword"},"request_id":{"type":"keyword"},"trace_id":{"type":"keyword"},"session_id":{"type":"keyword"},"research_id":{"type":"keyword"},"run_id":{"type":"keyword"}}}}}'
    networks:
      - industry_network

  kibana-setup:
    image: curlimages/curl:8.12.1
    container_name: industry_kibana_setup
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        until curl -fsS http://kibana:5601/api/status >/dev/null; do sleep 5; done
        if ! curl -fsS http://kibana:5601/api/data_views/data_view/industry-research-logs >/dev/null; then
          until curl -fsS -X POST http://kibana:5601/api/data_views/data_view \
            -H 'kbn-xsrf: observability-setup' \
            -H 'Content-Type: application/json' \
            --data '{"data_view":{"id":"industry-research-logs","title":"industry-research-logs-*","name":"Deep Research Logs","timeFieldName":"timestamp","allowNoIndex":true}}'; do sleep 5; done
        fi
    depends_on:
      - kibana
    networks:
      - industry_network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: industry_filebeat
    profiles: ["direct"]
    user: root
    restart: unless-stopped
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../backend/logs:/logs:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - industry_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: industry_logstash
    profiles: ["logstash"]
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "127.0.0.1:5044:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - industry_network

  filebeat-logstash:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: industry_filebeat_logstash
    profiles: ["logstash"]
    user: root
    restart: unless-stopped
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat-logstash.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../backend/logs:/logs:ro
      - filebeat_logstash_data:/usr/share/filebeat/data
    depends_on:
      - logstash
    networks:
      - industry_network

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: industry_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - industry_network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: industry_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9096:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - industry_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: industry_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}
    networks:
      - industry_network

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: industry_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - industry_network

  grafana:
    image: grafana/grafana:12.4.0
    container_name: industry_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - industry_network

volumes:
  filebeat_data:
  filebeat_logstash_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  industry_network:
    external: true
    name: industry_information_assistant_industry_network
