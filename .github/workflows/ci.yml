name: phase14-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deepresearch_test
          POSTGRES_USER: deepresearch
          POSTGRES_PASSWORD: deepresearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepresearch -d deepresearch_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check src migrations ops
      - run: mypy src/agent src/api_view
      - run: pytest --cov=src/agent --cov=src/api_view --cov-fail-under=80
        env:
          TEST_DATABASE_URL: postgresql+psycopg://deepresearch:deepresearch@localhost:5432/deepresearch_test
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://deepresearch:deepresearch@localhost:5432/deepresearch_test
      - run: alembic downgrade 0008_phase13_tool_flywheel && alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://deepresearch:deepresearch@localhost:5432/deepresearch_test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.25.0}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend quality

  images:
    runs-on: ubuntu-24.04
    needs: [test, frontend]
    strategy:
      matrix:
        target: [backend-core, ingestion, export, sandbox, frontend, nginx-edge]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: deepresearch/${{ matrix.target }}:${{ github.sha }}

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ops/validate_image_refs.py
        env: &images
          BACKEND_CORE_IMAGE: example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          INGESTION_IMAGE: example/ingestion@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          EXPORT_IMAGE: example/export@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          SANDBOX_IMAGE: example/sandbox@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          FRONTEND_IMAGE: example/frontend@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          NGINX_IMAGE: example/nginx@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          POSTGRES_IMAGE: example/postgres@sha256:1111111111111111111111111111111111111111111111111111111111111111
          REDIS_IMAGE: example/redis@sha256:2222222222222222222222222222222222222222222222222222222222222222
          MINIO_IMAGE: example/minio@sha256:3333333333333333333333333333333333333333333333333333333333333333
          ELASTICSEARCH_IMAGE: example/es@sha256:4444444444444444444444444444444444444444444444444444444444444444
          NEO4J_IMAGE: example/neo4j@sha256:5555555555555555555555555555555555555555555555555555555555555555
          PRIVATE_INFERENCE_IMAGE: example/vllm@sha256:6666666666666666666666666666666666666666666666666666666666666666
      - run: docker compose -f compose.production.yaml config --quiet
        env:
          <<: *images
          DATABASE_URL: postgresql+psycopg://deepresearch:secret@postgres:5432/deepresearch
          MINIO_ACCESS_KEY: deepresearch
          MINIO_SECRET_KEY: test-secret
          AUTH_JWT_PRIVATE_KEY: test-key
          CURSOR_SIGNING_KEY: test-cursor-key
          POSTGRES_DB: deepresearch
          POSTGRES_USER: deepresearch
          POSTGRES_PASSWORD: test-secret
          NEO4J_AUTH: neo4j/test-secret
