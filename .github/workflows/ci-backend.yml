name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test (pytest, needs_infra skipped by default)
        run: pytest tests -q
        env:
          ENV: test
          # 密钥从 GitHub Secrets 读取；未配置时回退到 test-only 占位（非真实密钥，
          # 与 tests/conftest.py 的导入期占位一致，仅满足 import 期校验）
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test-only-jwt-secret-key-do-not-use-in-production-0123456789' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test-only-postgres-password' }}
