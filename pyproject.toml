[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepresearch-mutilagent"
version = "0.1.0"
description = "DeepResearch Multi-Agent retrieval and evidence runtime"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "celery[redis]==5.4.0",
  "cryptography==50.0.2",
  "beautifulsoup4==4.12.3",
  "duckdb==1.1.3",
  "fastapi==0.115.8",
  "httpx==0.27.0",
  "jinja2==3.1.4",
  "PyJWT[crypto]==2.10.1",
  "langchain-core==0.3.37",
  "langgraph==0.2.76",
  "matplotlib==3.9.2",
  "psycopg[binary]==3.2.4",
  "minio==7.2.15",
  "opentelemetry-sdk==1.29.0",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pypdf==5.2.0",
  "python-docx==1.1.2",
  "reportlab==4.2.5",
  "python-multipart==0.0.20",
  "pydantic==2.10.6",
  "python-dotenv==0.21.0",
  "redis==5.2.1",
  "sqlalchemy==2.0.34",
  "sqlglot==26.3.9",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "mypy==1.14.1",
  "pandas-stubs==3.0.5.260914",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
  "types-beautifulsoup4==4.12.0.20250516",
]

[project.scripts]
deepresearch-dispatcher = "src.agent.workers.dispatcher_main:main"
deepresearch-tool-train = "src.agent.evaluation.training_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires TEST_DATABASE_URL pointing to PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"
