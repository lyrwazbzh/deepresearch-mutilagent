user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map $uri $audit_uri {
        ~^/api/v1/public/shares/[^/]+/assets/([^/]+)$ /api/v1/public/shares/[redacted]/assets/$1;
        ~^/api/v1/public/shares/[^/]+$ /api/v1/public/shares/[redacted];
        default $uri;
    }
    log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $audit_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log redacted;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=public_share:10m rate=10r/s;

    upstream api_backend { server api:8000; }
    upstream frontend_backend { server frontend:8080; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ~ ^/api/v1/tasks/[^/]+/events$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            include /etc/nginx/proxy-headers.conf;
        }

        location ~ ^/api/v1/tasks/[^/]+/data-files$ {
            client_max_body_size 260m;
            proxy_request_buffering off;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        location = /api/v1/documents {
            client_max_body_size 105m;
            proxy_request_buffering off;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        location /api/v1/public/shares/ {
            limit_req zone=public_share burst=30 nodelay;
            client_max_body_size 1m;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        location /api/ {
            client_max_body_size 2m;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            include /etc/nginx/proxy-headers.conf;
        }

        location / {
            proxy_pass http://frontend_backend;
            include /etc/nginx/proxy-headers.conf;
        }
    }
}
