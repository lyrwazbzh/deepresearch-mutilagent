filebeat.inputs:
  - type: filestream
    id: industry-research-json-logs
    enabled: true
    paths:
      - /logs/*.jsonl
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true

processors:
  - add_fields:
      target: ""
      fields:
        application: industry-information-assistant

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: industry-research-logs-%{+yyyy.MM.dd}

logging.json: true
logging.level: info
