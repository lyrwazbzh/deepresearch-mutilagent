apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Elasticsearch Logs
    uid: elasticsearch-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: industry-research-logs-*
    jsonData:
      index: industry-research-logs-*
      interval: Daily
      timeField: timestamp
      esVersion: "8.11.3"
    editable: false

